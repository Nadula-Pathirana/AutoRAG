[project]
name = "autorag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nadula Pathirana", email = "nadulapathirana2010@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.149.0",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "onnxruntime==1.23.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "torch==2.10.0",
]

[project.scripts]
autorag = "autorag:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

